name: NOVA HORIZON — Rust 26.3 Android ARM64

on:
  push:
    branches:
      - "nova-horizon/**"
    paths:
      - "nova-horizon/engine/**"
      - "nova-horizon/ui/**"
      - ".github/workflows/nova-horizon-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-horizon-rust-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build optimized NOVA HORIZON APK
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      HORIZON_ANDROID_COMMIT: 50e0ef409738310524e18f77aa8ee6c4378987ed
      ANDROID_NDK_VERSION: 28.2.13676358
      CARGO_BUILD_JOBS: 3
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout NOVA HORIZON integration
        uses: actions/checkout@v4

      - name: Fetch pinned Horizon Android engine
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/starling"
          git -C "$RUNNER_TEMP/starling" remote add origin https://github.com/scpao5/starling.git
          git -C "$RUNNER_TEMP/starling" fetch --depth 1 origin "$HORIZON_ANDROID_COMMIT"
          git -C "$RUNNER_TEMP/starling" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/starling" rev-parse HEAD)" = "$HORIZON_ANDROID_COMMIT"

      - name: Apply NOVA HORIZON identity and JNI package
        run: python3 nova-horizon/engine/prepare_starling.py "$RUNNER_TEMP/starling"

      - name: Set up Python and JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android SDK, NDK and Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake clang lld pkg-config libasound2-dev libudev-dev zip unzip curl
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" \
            "platforms;android-36" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust ARM64 target and cargo-ndk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nova-horizon-arm64-fast
          workspaces: ${{ runner.temp }}/starling -> target

      - name: Add swap for optimized native linking
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          where=/mnt
          available=$(df --output=avail -BG "$where" | tail -1 | tr -dc '0-9')
          if [ "${available:-0}" -lt 30 ]; then where="$RUNNER_TEMP"; fi
          sudo fallocate -l 10G "$where/nova-horizon-build.swap"
          sudo chmod 600 "$where/nova-horizon-build.swap"
          sudo mkswap "$where/nova-horizon-build.swap" >/dev/null
          sudo swapon "$where/nova-horizon-build.swap"
          free -h

      - name: Validate Android source, diagnostics and mobile defaults
        working-directory: ${{ runner.temp }}/starling
        run: |
          set -euo pipefail
          python3 -m py_compile "$GITHUB_WORKSPACE/nova-horizon/engine/prepare_starling.py" "$GITHUB_WORKSPACE/nova-horizon/ui/integrate_launcher.py"
          python3 -m unittest discover -s tests -p 'test_android*.py' -v
          python3 tools/test_android_diagnostics.py
          cargo test -p horizon-client-render --lib graphics::tests::mobile_defaults_keep_nearby_quality_and_cap_at_90_fps

      - name: Build optimized Rust game and Android launcher
        working-directory: ${{ runner.temp }}/starling
        env:
          PROFILE: fast
        run: |
          set -euo pipefail
          python3 packaging/android/build_apk.py --abi arm64-v8a --profile fast
          test -s target/android/NOVA-HORIZON-3.0.0-arm64-v8a.apk

      - name: Verify package, native engine, helpers and resource preparation kit
        working-directory: ${{ runner.temp }}/starling
        run: |
          set -euo pipefail
          APK=target/android/NOVA-HORIZON-3.0.0-arm64-v8a.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='dev.nova.horizon' versionCode='30000' versionName='3.0.0'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "application-label:'NOVA HORIZON'"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libhorizon_android.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libstarling_java.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libstarling_javac.so'
          unzip -l "$APK" | grep -F 'assets/prepare-kit.zip'
          unzip -l "$APK" | grep -F 'assets/lowbudget.zip'
          unzip -l "$APK" | grep -F 'assets/StarlingVisuals.zip'
          unzip -l "$APK" | grep -F 'assets/launcher-bg.webp'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$GITHUB_WORKSPACE/nova-horizon/engine-output"
          cp "$APK" "$GITHUB_WORKSPACE/nova-horizon/engine-output/NOVA-HORIZON-3.0.0-arm64-v8a.apk"
          sha256sum "$GITHUB_WORKSPACE/nova-horizon/engine-output/NOVA-HORIZON-3.0.0-arm64-v8a.apk" | tee "$GITHUB_WORKSPACE/nova-horizon/engine-output/NOVA-HORIZON-3.0.0-arm64-v8a.apk.sha256"
          printf 'NOVA HORIZON 3.0.0\nEngine commit: %s\nBuild profile: fast\nABI: arm64-v8a\n' "$HORIZON_ANDROID_COMMIT" > "$GITHUB_WORKSPACE/nova-horizon/engine-output/build-info.txt"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-horizon-26.3-arm64
          path: |
            nova-horizon/engine-output/NOVA-HORIZON-3.0.0-arm64-v8a.apk
            nova-horizon/engine-output/NOVA-HORIZON-3.0.0-arm64-v8a.apk.sha256
            nova-horizon/engine-output/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload native symbols for crash diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: nova-horizon-26.3-arm64-symbols
          path: ${{ runner.temp }}/starling/target/android/libhorizon_android-symbols.so
          if-no-files-found: error
          retention-days: 30
