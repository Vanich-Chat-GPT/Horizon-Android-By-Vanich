name: Build signed ARM64 APK and publish verified release

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout project customizations
        uses: actions/checkout@v4
        with:
          path: overlay
          persist-credentials: false
      - name: Checkout upstream Horizon Android (GPL-3.0)
        uses: actions/checkout@v4
        with:
          repository: Vasysik/horizon-android
          # Pin tested source layout; the upstream android branch was reorganized
          # on 2026-10-29 and no longer contains the legacy patch paths.
          ref: c11af2681216b2b27b36b2723d083729c300c595
          path: upstream
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust 1.95.0 and ARM64 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: aarch64-linux-android
          components: clippy
      - name: Setup preinstalled Android SDK and accept licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install required Android components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Apply native launcher, touch customization and performance patches
        run: |
          python3 overlay/tools/apply_vanich_overlay.py upstream
          python3 overlay/tools/apply_touch_performance.py upstream
          python3 overlay/tools/apply_release_polish.py upstream
          python3 overlay/tools/apply_low_end_update.py upstream
          python3 overlay/tools/apply_background_install.py upstream
          python3 overlay/tools/apply_v1_2_upgrade.py upstream
          python3 overlay/tools/apply_screenshot_home.py upstream
          python3 overlay/tools/apply_bounded_chunk_results.py upstream
          python3 overlay/tools/apply_joystick_modes.py upstream
          python3 overlay/tools/apply_friend_code_ru.py upstream
          python3 overlay/tools/apply_v1_3_3_catalog.py upstream
          python3 overlay/tools/apply_visible_branding_ru.py upstream
          python3 overlay/tools/apply_reference_banner.py upstream
      - name: Validate patched sources
        run: |
          python3 -m py_compile overlay/tools/apply_vanich_overlay.py overlay/tools/apply_touch_performance.py overlay/tools/apply_release_polish.py overlay/tools/apply_low_end_update.py overlay/tools/apply_background_install.py overlay/tools/apply_v1_2_upgrade.py overlay/tools/apply_screenshot_home.py overlay/tools/apply_bounded_chunk_results.py overlay/tools/apply_joystick_modes.py overlay/tools/apply_friend_code_ru.py overlay/tools/apply_v1_3_3_catalog.py overlay/tools/apply_visible_branding_ru.py overlay/tools/apply_reference_banner.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('upstream/packaging/android/res/values/styles.xml')
          PY
          cd upstream
          cargo fmt --all
          git diff --check
      - name: Prepare official engine metadata
        working-directory: upstream
        run: python3 tools/android_prepare.py
      - name: Restore persistent Android signing key (required for updates)
        env:
          HORIZON_SIGNING_KEYSTORE_B64: ${{ secrets.HORIZON_SIGNING_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HORIZON_SIGNING_KEYSTORE_B64" ]; then
            echo 'Missing HORIZON_SIGNING_KEYSTORE_B64. Refusing to create a random per-build key: that would break Android updates.' >&2
            exit 1
          fi
          mkdir -p upstream/.local/android
          printf '%s' "$HORIZON_SIGNING_KEYSTORE_B64" | base64 --decode > upstream/.local/android/debug.keystore
          chmod 600 upstream/.local/android/debug.keystore
          keytool -list -keystore upstream/.local/android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Build Android ARM64 public-mode TEST APK
        working-directory: upstream
        run: python3 tools/android_build.py --abi arm64-v8a --public --gradle "$(command -v gradle)" --java-home "$JAVA_HOME"
      - name: Verify ARM64 APK integrity
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          p=pathlib.Path('upstream/.local/android/apk/arm64-v8a/horizon-android-public.apk')
          with zipfile.ZipFile(p) as a:
              assert a.testzip() is None
              so=[s for s in a.namelist() if s.startswith('lib/') and s.endswith('.so')]
              assert so and all(s.startswith('lib/arm64-v8a/') for s in so), so
          print('ARM64 archive integrity passed:',p,p.stat().st_size,'bytes')
          PY
      - name: Verify APK signature, version and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="upstream/.local/android/apk/arm64-v8a/horizon-android-public.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "versionCode='34'.*versionName='1.3.3'"
          mkdir -p dist
          cp "$APK" dist/HorizonCraft-v1.3.3-android-arm64-signed.apk
          (cd dist && sha256sum HorizonCraft-v1.3.3-android-arm64-signed.apk > SHA256SUMS.txt)
      - name: Verify update compatibility with v1.1.1 signing identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Vanich-Chat-GPT/Horizon-Android-By-Vanich/releases/download/v1.1.1-low-end/HorizonCraft-v1.1.1-android-arm64-signed.apk" \
            --output previous.apk
          APK="dist/HorizonCraft-v1.3.3-android-arm64-signed.apk"
          previous_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs previous.apk | grep 'Signer #1 certificate SHA-256 digest:' | head -1)
          current_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest:' | head -1)
          test "$previous_cert" = "$current_cert"
          echo "Signature matches v1.1.1: Android in-place upgrade supported"
      - name: Check certificate compatibility with original v1.0.0 release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Vanich-Chat-GPT/Horizon-Android-By-Vanich/releases/download/v1.0.0-minecraft-java-android-native/Minecraft-Java-on-Android-Native-Horizon-by-Vanich-v1.0.0-arm64.apk" \
            -o original.apk
          APK="dist/HorizonCraft-v1.3.3-android-arm64-signed.apk"
          original_package=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging original.apk | grep '^package:')
          current_package=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:')
          echo "$original_package"
          echo "$current_package"
          test "$(echo "$original_package" | sed -n "s/.*name='\([^']*\)'.*/\1/p")" = "$(echo "$current_package" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          original_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs original.apk | grep 'Signer #1 certificate SHA-256 digest:' | head -1)
          current_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256 digest:' | head -1)
          if [ "$original_cert" != "$current_cert" ]; then
            echo "::warning::Original v1.0.0 used a different signing certificate; in-place upgrade from that APK is impossible with the current key."
          else
            echo "Original v1.0.0 certificate matches"
          fi
      - name: Upload signed build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Android-By-Vanich-TEST-arm64
          path: upstream/.local/android/apk/arm64-v8a/horizon-android-public.apk
          if-no-files-found: error
          retention-days: 7

      - name: Check only latest verified build publishes release
        id: release_gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-test.yml/runs?branch=main&per_page=1" --jq '.workflow_runs[0].run_number')
          if [ "$latest" = "$GITHUB_RUN_NUMBER" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded build $GITHUB_RUN_NUMBER; latest is $latest"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish verified signed APK as a stable GitHub Release
        if: steps.release_gate.outputs.publish == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.HORIZON_RELEASE_TOKEN || github.token }}
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.HORIZON_RELEASE_TOKEN || github.token }}
          tag_name: v1.3.3-ru-r${{ github.run_number }}
          name: HorizonCraft v1.3.3 — Русский интерфейс · ARM64
          prerelease: false
          draft: false
          target_commitish: ${{ github.sha }}
          body: |
            HorizonCraft Android ARM64. Русификация игровых настроек
            сенсорного управления, фирменное оформление HorizonCraft,
            адаптивный главный экран и оптимизация обработки чанков.
            Подпись и совместимость обновления с v1.1.1 проходят
            автоматическую проверку. FPS/RAM на реальном устройстве
            ещё не измерены.
          files: |
            dist/HorizonCraft-v1.3.3-android-arm64-signed.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
