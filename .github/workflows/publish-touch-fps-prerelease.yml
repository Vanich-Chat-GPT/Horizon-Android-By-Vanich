name: Publish approved touch/FPS test as GitHub pre-release

on:
  workflow_run:
    workflows: ["Android test APK (no release)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  prerelease:
    # Only the user-approved, exact test build. Never publish unrelated builds.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id == 40778979920 && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download verified Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Horizon-Android-By-Vanich-TEST-arm64
          repository: Vanich-Chat-GPT/Horizon-Android-By-Vanich
          run-id: 40778979920
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Verify ZIP integrity and ARM64 engine
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find apk -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          python3 - "${apks[0]}" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None, "APK ZIP corrupted"
              assert 'AndroidManifest.xml' in z.namelist(), "Missing manifest"
              assert any(x.startswith('lib/arm64-v8a/') and x.endswith('.so') for x in z.namelist()), "Missing ARM64 engine"
          PY
          cp "${apks[0]}" Horizon-Android-By-Vanich-Touch-FPS-TEST-arm64.apk
          sha256sum Horizon-Android-By-Vanich-Touch-FPS-TEST-arm64.apk > SHA256SUMS.txt
      - name: Publish prerelease with downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='android-touch-fps-test-2026-10-29'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This prerelease already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create "$TAG" \
            Horizon-Android-By-Vanich-Touch-FPS-TEST-arm64.apk \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title 'Horizon Android by Vanich — Touch Controls + FPS TEST' \
            --notes 'PRE-RELEASE / EXPERIMENTAL. Native ARM64 Minecraft client. Includes touch button drag/resize/opacity, 2.5% snap-to-grid, real graphics presets and Android chunk processing budget (48 completed jobs per frame). Source build and APK archive verified by GitHub Actions. On-device FPS and gameplay stability have NOT been benchmarked; this update aims to reduce frame-time spikes, not guarantee a specific FPS. Download the APK from Assets. Do not treat this as a stable release.' \
            --prerelease \
            --latest=false
