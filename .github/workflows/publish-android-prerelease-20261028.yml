name: Publish verified Android APK as pre-release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-prerelease-20261028.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-verified-apk:
    if: github.repository == 'Vanich-Chat-GPT/Horizon-Android-By-Vanich'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download successful ARM64 APK from build 40772826873
        uses: actions/download-artifact@v4
        with:
          name: Horizon-Android-By-Vanich-TEST-arm64
          repository: Vanich-Chat-GPT/Horizon-Android-By-Vanich
          run-id: 40772826873
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded
      - name: Check and rename real Android APK
        shell: bash
        run: |
          set -euo pipefail
          find downloaded -maxdepth 3 -type f -print
          mapfile -t apks < <(find downloaded -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          python3 - "${apks[0]}" <<'PY'
          import sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None, 'Corrupt APK ZIP'
              names=z.namelist()
              assert any(x.startswith('lib/arm64-v8a/') and x.endswith('.so') for x in names), 'Missing native ARM64 engine'
              assert 'AndroidManifest.xml' in names, 'Missing manifest'
          print('APK ZIP, manifest, ARM64 engine verified')
          PY
          cp "${apks[0]}" Horizon-Android-By-Vanich-TEST-arm64.apk
          sha256sum Horizon-Android-By-Vanich-TEST-arm64.apk | tee SHA256SUMS.txt
      - name: Publish GitHub PRE-RELEASE (not stable release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='android-test-2026-10-28'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Pre-release tag already exists; refusing to overwrite existing assets."
            exit 1
          fi
          gh release create "$TAG" \
            Horizon-Android-By-Vanich-TEST-arm64.apk \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title 'Horizon Android by Vanich — ARM64 TEST' \
            --notes 'Experimental native Horizon Android ARM64 test APK, built successfully in GitHub Actions run 40772826873. Russian/English launcher, Material You-inspired UI, 40–100% render scale and graphics presets. Minecraft assets are NOT included; they are obtained from official sources as required. On-device gameplay and FPS are not yet verified. This is a pre-release, NOT a stable release.' \
            --prerelease \
            --latest=false
