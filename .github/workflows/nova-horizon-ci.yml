name: NOVA HORIZON — independent CI

on:
  push:
    branches:
      - "nova-horizon/**"
    paths:
      - "nova-horizon/**"
      - ".github/workflows/nova-horizon-ci.yml"
  pull_request:
    paths:
      - "nova-horizon/**"
      - ".github/workflows/nova-horizon-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-horizon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nova-horizon/core
      - name: Format
        run: cargo fmt --manifest-path nova-horizon/core/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --manifest-path nova-horizon/core/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path nova-horizon/core/Cargo.toml --all-targets -- -D warnings

  android-arm64:
    name: Android ARM64 debug APK
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform, build tools and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nova-horizon/core
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust ARM64 library
        working-directory: nova-horizon/core
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Android unit tests
        working-directory: nova-horizon
        run: gradle testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        working-directory: nova-horizon
        run: gradle assembleDebug --no-daemon
      - name: Verify APK package and ABI
        run: |
          APK="nova-horizon/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='dev.nova.horizon'"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libnova_core.so'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-horizon-arm64-debug
          path: nova-horizon/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
